# Copy this file to application-local.properties (which is gitignored) and run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# Or set the corresponding environment variables (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION).

spring.datasource.url=jdbc:postgresql://localhost:5432/kishi
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

# Must be at least 256 bits (32+ characters) for HMAC-SHA256 signing
jwt.secret=REPLACE_WITH_A_SECURE_RANDOM_SECRET
jwt.expiration=3600000
